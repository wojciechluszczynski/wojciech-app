<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wojciech Łuszczyński — Sign in</title>
<meta name="robots" content="noindex,nofollow" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<script>
  (function(){
    try {
      var saved = localStorage.getItem('theme');
      var mode = saved ? saved : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', mode);
      document.documentElement.style.colorScheme = mode;
    } catch(e) { document.documentElement.setAttribute('data-theme','light'); }
  })();
</script>
<style>
  :root {
    --bg:#F3F2EF; --bg1:#FFFFFF; --bg2:#F0EFEC;
    --lime:#EBFF00; --lime-focus:rgba(235,255,0,0.22);
    --border:rgba(0,0,0,0.08); --border-hi:rgba(0,0,0,0.18);
    --text:#080808; --text-2:#555; --text-3:#999;
  }
  [data-theme="dark"] {
    --bg:#09090b; --bg1:#111113; --bg2:#1a1a1d;
    --border:rgba(255,255,255,0.08); --border-hi:rgba(255,255,255,0.18);
    --text:#f0f0f0; --text-2:#a0a0a8; --text-3:#555560;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Geist','Inter',system-ui,sans-serif;
    transition: background .2s, color .2s;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Top bar ── */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 24px;
  }

  .icon-btn {
    width: 32px; height: 32px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 999px; border: none; background: none;
    color: var(--text-3); cursor: pointer;
    transition: color .15s, background .15s;
  }
  .icon-btn:hover { color: var(--text); background: var(--bg2); }
  [data-theme="dark"] .icon-btn { color: var(--lime); }

  .langtoggle {
    display: inline-flex; align-items: center;
    background: var(--bg1); border: 1px solid var(--border);
    border-radius: 999px; padding: 3px; gap: 0;
  }
  .langbtn {
    font-size: 10.5px; font-weight: 700; letter-spacing: .4px;
    padding: 5px 11px; border-radius: 999px;
    background: none; border: none; color: var(--text-3); cursor: pointer;
    font-family: inherit; transition: all .15s;
  }
  .langbtn.active { background: var(--lime); color: #080808; }
  .langbtn:not(.active):hover { color: var(--text-2); }

  /* ── Center stage ── */
  .stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 24px 48px;
  }

  .logo-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--lime);
    margin-bottom: 20px;
  }

  .name {
    font-size: 20px; font-weight: 800; letter-spacing: -0.02em;
    margin-bottom: 32px;
    color: var(--text);
  }

  /* ── Form ── */
  .form {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    width: 100%;
    max-width: 320px;
  }

  .input {
    width: 100%;
    padding: 13px 18px;
    background: var(--bg1);
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--text);
    font-size: 14px; font-family: inherit;
    outline: none; text-align: center;
    transition: border-color .15s, box-shadow .15s;
  }
  .input::placeholder { color: var(--text-3); }
  .input:focus { border-color: var(--border-hi); box-shadow: 0 0 0 3px var(--lime-focus); }

  .btn {
    width: 100%;
    padding: 13px;
    background: var(--lime); color: #080808;
    font-size: 13px; font-weight: 800; letter-spacing: .2px;
    border: none; border-radius: 999px;
    cursor: pointer; font-family: inherit;
    transition: opacity .15s, transform .15s;
  }
  .btn:hover:not(:disabled) { opacity: .88; transform: translateY(-1px); }
  .btn:disabled { cursor: not-allowed; opacity: .5; }

  .err {
    font-size: 12px; color: #ef4444; font-weight: 600;
    min-height: 18px; text-align: center;
    opacity: 0; transition: opacity .2s;
  }
  .err.show { opacity: 1; }

  /* ── Icon swap ── */
  .icon-sun { display: none; }
  .icon-moon { display: block; }
  [data-theme="dark"] .icon-sun { display: block; }
  [data-theme="dark"] .icon-moon { display: none; }
</style>
</head>
<body>

<div class="topbar">
  <button class="icon-btn" id="themeBtn" aria-label="Toggle theme" type="button">
    <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
  </button>
  <div class="langtoggle" role="group" aria-label="Language">
    <button class="langbtn" data-lang="pl" type="button">PL</button>
    <button class="langbtn active" data-lang="en" type="button">EN</button>
    <button class="langbtn" data-lang="it" type="button">IT</button>
  </div>
</div>

<div class="stage">
  <div class="logo-dot" aria-hidden="true"></div>
  <h1 class="name">Wojciech Łuszczyński</h1>
  <form class="form" id="loginForm" novalidate>
    <input class="input" id="pw" type="password" placeholder="Password" autocomplete="current-password" required autofocus />
    <button class="btn" id="submitBtn" type="submit" data-i18n="submit">Enter</button>
    <div class="err" id="err" role="alert" data-i18n="err">Wrong password</div>
  </form>
</div>

<script>
  // Theme toggle
  document.getElementById('themeBtn').addEventListener('click', function() {
    var cur = document.documentElement.getAttribute('data-theme');
    var next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    document.documentElement.style.colorScheme = next;
    try { localStorage.setItem('theme', next); } catch(e){}
  });

  // i18n
  var I18N = {
    en: { submit:'Enter', err:'Wrong password', placeholder:'Password' },
    pl: { submit:'Wejdź', err:'Nieprawidłowe hasło', placeholder:'Hasło' },
    it: { submit:'Entra', err:'Password errata', placeholder:'Password' },
  };
  function setLang(l) {
    var dict = I18N[l] || I18N.en;
    document.getElementById('pw').placeholder = dict.placeholder;
    document.getElementById('submitBtn').textContent = dict.submit;
    var errEl = document.getElementById('err');
    if (!errEl.classList.contains('show')) errEl.textContent = dict.err;
    document.querySelectorAll('.langbtn').forEach(function(b){
      b.classList.toggle('active', b.getAttribute('data-lang') === l);
    });
    try { localStorage.setItem('lang', l); } catch(e){}
  }
  document.querySelectorAll('.langbtn').forEach(function(b){
    b.addEventListener('click', function(){ setLang(b.getAttribute('data-lang')); });
  });
  var savedLang = (function(){ try{return localStorage.getItem('lang');}catch(e){return null;} })();
  if (savedLang && I18N[savedLang]) setLang(savedLang);

  // Login submit
  var form = document.getElementById('loginForm');
  var pwInput = document.getElementById('pw');
  var errEl = document.getElementById('err');
  var btn = document.getElementById('submitBtn');

  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    errEl.classList.remove('show');
    var password = (pwInput.value || '').trim();
    if (!password) { pwInput.focus(); return; }

    btn.disabled = true;
    var origText = btn.textContent;
    btn.textContent = '...';

    try {
      var res = await fetch('/api/auth', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ password: password }),
        credentials: 'same-origin',
      });
      if (res.ok) {
        window.location.href = '/';
        return;
      }
      errEl.textContent = (function(){ try{return I18N[localStorage.getItem('lang')]||I18N.en;}catch(e){return I18N.en;} })().err;
      errEl.classList.add('show');
      pwInput.value = '';
      pwInput.focus();
    } catch (err) {
      errEl.textContent = 'Network error';
      errEl.classList.add('show');
    } finally {
      btn.disabled = false;
      btn.textContent = origText;
    }
  });
</script>

</body>
</html>
