<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wojciech Łuszczyński — Sign in</title>
<meta name="robots" content="noindex,nofollow" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<script>
  (function(){
    try {
      var saved = localStorage.getItem('theme');
      var mode = saved ? saved : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', mode);
      document.documentElement.style.colorScheme = mode;
    } catch(e) { document.documentElement.setAttribute('data-theme','light'); }
  })();
</script>
<style>
  @font-face {
    font-family: 'Geist';
    src: url('/fonts/Geist-Regular.woff2') format('woff2');
    font-weight: 400; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'Geist';
    src: url('/fonts/Geist-Medium.woff2') format('woff2');
    font-weight: 500; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'Geist';
    src: url('/fonts/Geist-SemiBold.woff2') format('woff2');
    font-weight: 600; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'Geist';
    src: url('/fonts/Geist-Bold.woff2') format('woff2');
    font-weight: 700; font-style: normal; font-display: swap;
  }

  :root {
    --bg:#f8f5ee; --bg1:#ffffff; --bg2:#f1eee7;
    --lime:#EBFF00; --lime-dim:rgba(235,255,0,0.14); --lime-glow:rgba(235,255,0,0.22);
    --border:rgba(0,0,0,0.08); --border-hi:rgba(0,0,0,0.15);
    --text:#171717; --text-2:#66645f; --text-3:#9b9890;
    --card-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 8px 28px rgba(0,0,0,0.07);
    --radial-glow: transparent;
    --radius-card: 18px;
    --radius-btn: 999px;
  }
  [data-theme="dark"] {
    --bg:#0c0c0c; --bg1:#171717; --bg2:#222222;
    --border:rgba(255,255,255,0.08); --border-hi:rgba(255,255,255,0.15);
    --text:#f2f2f2; --text-2:#888888; --text-3:#555555;
    --card-shadow: 0 0 40px rgba(235,255,0,0.06);
    --radial-glow: radial-gradient(ellipse at 50% -10%, rgba(235,255,0,0.12) 0%, transparent 55%);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    background-image: var(--radial-glow);
    color: var(--text);
    font-family: 'Geist', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Topbar */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 28px;
  }

  /* Theme toggle */
  .icon-btn {
    width: 34px; height: 34px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: var(--radius-btn); border: 1px solid var(--border);
    background: var(--bg1); color: var(--text-2); cursor: pointer;
    transition: color .15s, background .15s, border-color .15s;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--border-hi); }
  [data-theme="dark"] .icon-btn { color: var(--lime); }

  .icon-sun { display: none; }
  .icon-moon { display: block; }
  [data-theme="dark"] .icon-sun { display: block; }
  [data-theme="dark"] .icon-moon { display: none; }

  /* Language selector — dropdown matching wojciech.io style */
  .lang-wrap { position: relative; }
  .lang-summary {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 700; letter-spacing: .5px;
    padding: 7px 12px; border-radius: var(--radius-btn);
    border: 1px solid var(--border); background: var(--bg1);
    color: var(--text-2); cursor: pointer; list-style: none;
    transition: color .15s, border-color .15s;
    font-family: inherit;
  }
  .lang-summary:hover { color: var(--text); border-color: var(--border-hi); }
  .lang-summary::-webkit-details-marker { display: none; }
  .lang-dropdown {
    position: absolute; right: 0; top: calc(100% + 8px);
    z-index: 50; min-width: 160px;
    border-radius: 14px; border: 1px solid var(--border);
    background: var(--bg1); padding: 4px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.12);
  }
  .lang-opt {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 12px; border-radius: 10px;
    font-size: 13px; font-weight: 500; color: var(--text-2);
    text-decoration: none; cursor: pointer;
    transition: background .12s, color .12s;
  }
  .lang-opt:hover, .lang-opt--active { background: var(--bg2); color: var(--text); }
  .lang-opt-code {
    font-size: 11px; font-weight: 700; letter-spacing: .5px;
    color: var(--text-3);
  }
  .lang-opt--active .lang-opt-code { color: var(--lime); }

  /* Stage */
  .stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 0 24px 40px; }

  /* Card */
  .card {
    width: 100%; max-width: 360px;
    background: var(--bg1);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    padding: 32px 28px 26px;
    text-align: center;
    box-shadow: var(--card-shadow);
  }

  /* Avatar */
  .avatar-wrap { display: flex; justify-content: center; margin-bottom: 14px; }
  .avatar {
    width: 82px; height: 82px;
    border-radius: 50%;
    border: 2px solid var(--lime);
    object-fit: cover; object-position: center 15%;
    box-shadow: 0 0 24px var(--lime-glow);
  }
  .avatar-fallback {
    width: 82px; height: 82px;
    border-radius: 50%;
    border: 2px solid var(--lime);
    background: linear-gradient(135deg, #2d4f7c 0%, #1a3050 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 700; color: rgba(255,255,255,.85);
    letter-spacing: -1px;
    box-shadow: 0 0 24px var(--lime-glow);
  }

  /* Name + badge */
  .name {
    font-size: 20px; font-weight: 700; letter-spacing: -0.02em;
    margin: 0 0 8px; color: var(--text);
  }
  .badge {
    display: inline-block;
    font-size: 11px; font-weight: 700; letter-spacing: .3px;
    padding: 4px 12px; border-radius: var(--radius-btn);
    background: var(--lime); color: #080808;
    margin-bottom: 14px;
  }

  /* Social links */
  .socials {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-bottom: 18px;
  }
  .social-link {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 600; letter-spacing: .2px;
    padding: 5px 10px; border-radius: var(--radius-btn);
    border: 1px solid var(--border); background: var(--bg2);
    color: var(--text-2); text-decoration: none;
    transition: color .15s, border-color .15s, background .15s;
  }
  .social-link:hover { color: var(--text); border-color: var(--border-hi); background: var(--bg1); }

  /* Divider */
  .divider { height: 1px; background: var(--border); margin: 0 0 18px; }

  /* Form */
  .form { display: flex; flex-direction: column; gap: 8px; }
  .input {
    width: 100%; padding: 12px 16px;
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: var(--radius-btn); color: var(--text);
    font-size: 13px; font-family: inherit;
    outline: none; text-align: center;
    transition: border-color .15s, box-shadow .15s;
  }
  .input::placeholder { color: var(--text-3); }
  .input:focus { border-color: var(--lime); box-shadow: 0 0 0 3px rgba(235,255,0,.14); }

  .btn {
    width: 100%; padding: 13px;
    background: var(--lime); color: #080808;
    font-size: 13px; font-weight: 700; letter-spacing: .2px;
    border: none; border-radius: var(--radius-btn);
    cursor: pointer; font-family: inherit;
    transition: background .15s, transform .1s, opacity .15s;
  }
  .btn:hover:not(:disabled) { background: #d4e600; transform: translateY(-1px); }
  .btn:disabled { cursor: not-allowed; opacity: .6; }

  .err {
    min-height: 16px; font-size: 12px; color: #ef4444; font-weight: 600;
    text-align: center; opacity: 0; transition: opacity .2s;
  }
  .err.show { opacity: 1; }

  @media (max-width: 480px) {
    .card { padding: 26px 22px 22px; }
    .name { font-size: 18px; }
    .topbar { padding: 14px 16px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <button class="icon-btn" id="themeBtn" aria-label="Toggle theme" type="button">
    <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
  </button>

  <details class="lang-wrap" id="langDetails">
    <summary class="lang-summary" id="langSummary" aria-label="Language">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      <span id="langLabel">EN</span>
    </summary>
    <div class="lang-dropdown">
      <button class="lang-opt lang-opt--active" data-lang="en" type="button">
        <span>English</span><span class="lang-opt-code">EN</span>
      </button>
      <button class="lang-opt" data-lang="pl" type="button">
        <span>Polski</span><span class="lang-opt-code">PL</span>
      </button>
      <button class="lang-opt" data-lang="de" type="button">
        <span>Deutsch</span><span class="lang-opt-code">DE</span>
      </button>
      <button class="lang-opt" data-lang="dk" type="button">
        <span>Dansk</span><span class="lang-opt-code">DK</span>
      </button>
      <button class="lang-opt" data-lang="no" type="button">
        <span>Norsk</span><span class="lang-opt-code">NO</span>
      </button>
      <button class="lang-opt" data-lang="jp" type="button">
        <span>日本語</span><span class="lang-opt-code">JP</span>
      </button>
      <button class="lang-opt" data-lang="it" type="button">
        <span>Italiano</span><span class="lang-opt-code">IT</span>
      </button>
    </div>
  </details>
</div>

<div class="stage">
  <div class="card">
    <div class="avatar-wrap">
      <img class="avatar" id="avatar" src="/wojciech-photo.png" alt="Wojciech Łuszczyński" onerror="this.outerHTML='<div class=&quot;avatar-fallback&quot;>WŁ</div>'"/>
    </div>
    <h1 class="name">Wojciech Łuszczyński</h1>
    <span class="badge" data-i18n="badge">GTM Architect &amp; Growth Operator</span>

    <div class="socials">
      <a href="https://wojciech.io" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="Portfolio">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        wojciech.io
      </a>
      <a href="https://github.com/wojciechluszczynski" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="GitHub">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0 1 12 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/></svg>
        GitHub
      </a>
      <a href="https://www.linkedin.com/in/wojciech-luszczynski/" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="LinkedIn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
        LinkedIn
      </a>
    </div>

    <div class="divider"></div>
    <form class="form" id="loginForm" novalidate>
      <input class="input" id="pw" type="password" placeholder="Password" autocomplete="current-password" required autofocus data-i18n-placeholder="placeholder" />
      <button class="btn" id="submitBtn" type="submit" data-i18n="submit">Enter →</button>
      <div class="err" id="err" role="alert" data-i18n="err">Wrong password</div>
    </form>
  </div>
</div>

<script>
  // Theme toggle
  document.getElementById('themeBtn').addEventListener('click', function() {
    var cur = document.documentElement.getAttribute('data-theme');
    var next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    document.documentElement.style.colorScheme = next;
    try { localStorage.setItem('theme', next); } catch(e){}
  });

  // i18n
  var I18N = {
    en: { badge:'GTM Architect & Growth Operator', submit:'Enter →', err:'Wrong password', placeholder:'Password' },
    pl: { badge:'GTM Architect & Growth Operator', submit:'Wejdź →', err:'Nieprawidłowe hasło', placeholder:'Hasło' },
    de: { badge:'GTM Architect & Growth Operator', submit:'Einloggen →', err:'Falsches Passwort', placeholder:'Passwort' },
    dk: { badge:'GTM Architect & Growth Operator', submit:'Log ind →', err:'Forkert adgangskode', placeholder:'Adgangskode' },
    no: { badge:'GTM Architect & Growth Operator', submit:'Logg inn →', err:'Feil passord', placeholder:'Passord' },
    jp: { badge:'GTMアーキテクト & グロースオペレーター', submit:'入る →', err:'パスワードが違います', placeholder:'パスワード' },
    it: { badge:'GTM Architect & Growth Operator', submit:'Entra →', err:'Password errata', placeholder:'Password' },
  };

  var LANG_LABELS = { en:'EN', pl:'PL', de:'DE', dk:'DK', no:'NO', jp:'JP', it:'IT' };

  function setLang(l) {
    var dict = I18N[l] || I18N.en;
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      var key = el.getAttribute('data-i18n');
      if (dict[key] != null) el.textContent = dict[key];
    });
    var pw = document.getElementById('pw');
    if (pw) pw.placeholder = dict.placeholder;
    var lbl = document.getElementById('langLabel');
    if (lbl) lbl.textContent = LANG_LABELS[l] || l.toUpperCase();
    document.querySelectorAll('.lang-opt').forEach(function(b){
      b.classList.toggle('lang-opt--active', b.getAttribute('data-lang') === l);
    });
    try { localStorage.setItem('lang', l); } catch(e){}
    // Close dropdown
    var d = document.getElementById('langDetails');
    if (d) d.removeAttribute('open');
  }

  document.querySelectorAll('.lang-opt').forEach(function(b){
    b.addEventListener('click', function(){ setLang(b.getAttribute('data-lang')); });
  });

  // Close dropdown on outside click
  document.addEventListener('click', function(e) {
    var d = document.getElementById('langDetails');
    if (d && d.open && !d.contains(e.target)) d.removeAttribute('open');
  });

  var savedLang = (function(){ try{return localStorage.getItem('lang');}catch(e){return null;} })();
  if (savedLang && I18N[savedLang]) setLang(savedLang);

  // Login submit
  var form = document.getElementById('loginForm');
  var pwInput = document.getElementById('pw');
  var errEl = document.getElementById('err');
  var btn = document.getElementById('submitBtn');

  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    errEl.classList.remove('show');
    var password = (pwInput.value || '').trim();
    if (!password) { pwInput.focus(); return; }

    btn.disabled = true;
    var origBtnText = btn.textContent;
    btn.textContent = '…';

    try {
      var res = await fetch('/api/auth', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ password: password }),
        credentials: 'same-origin',
      });
      if (res.ok) {
        window.location.href = '/';
        return;
      }
      errEl.classList.add('show');
      pwInput.value = '';
      pwInput.focus();
    } catch (err) {
      errEl.textContent = 'Network error';
      errEl.classList.add('show');
    } finally {
      btn.disabled = false;
      btn.textContent = origBtnText;
    }
  });
</script>

</body>
</html>
